[project]
name = "mesh"
version = "0.1.0"
description = "Beginner-friendly 3D modeling for 3D printing"
requires-python = "==3.12.*"
dependencies = [
    "pyside6>=6.7",
    "vtk>=9.3",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "numpy>=1.26",
    "lxml>=5.0",
    "pycollada>=0.8",
    "scipy>=1.13",
    "networkx>=3.0",
]

[project.scripts]
mesh = "mesh.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
